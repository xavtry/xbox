
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1on1 Soccer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #101010;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game ruffle-embed,
    #game ruffle-player,
    #game embed {
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      inset: auto 0 0;
      padding: 8px;
      color: #aaa;
      background: #101010;
      font: 12px Arial, sans-serif;
      text-align: center;
    }
  </style>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>

<body>
  <div id="game">
    <embed
      src="./1on1soccer.swf"
      type="application/x-shockwave-flash"
      width="100%"
      height="100%"
    >
  </div>

  <div id="status">
    Flash emulation provided by Ruffle
  </div>
</body>
</html>
